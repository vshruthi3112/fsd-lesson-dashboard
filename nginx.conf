# ============================================
# Nginx Configuration for Lesson Dashboard Frontend
# ============================================
#
# Nginx serves two roles here:
# 1. STATIC FILE SERVER: Serves the React build (HTML, CSS, JS)
# 2. REVERSE PROXY: Forwards /api requests to the Spring Boot backend
#
# This replaces Vite's dev server proxy in production.

server {
    listen 80;
    server_name localhost;

    # ── Serve React static files ──────────────────────
    # All files built by Vite live in /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    # ── React Router support ──────────────────────────
    # React is a Single Page Application (SPA).
    # When a user navigates to /lessons/1, the browser requests that path.
    # But there's no /lessons/1 file on disk — React handles routing in JS.
    # This rule says: "If the file doesn't exist, serve index.html instead"
    # so React's router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Reverse Proxy ─────────────────────────────
    # Forward /api requests to the Spring Boot backend.
    # In Docker Compose, "backend" is the service name, which Docker
    # resolves to the backend container's IP address automatically.
    #
    # Example: Browser requests GET /api/lessons
    #   → Nginx forwards to http://backend:8080/api/lessons
    #   → Spring Boot responds with JSON
    #   → Nginx sends the response back to the browser
    location /api/ {
        proxy_pass https://fsd-lesson-dashboard-production.up.railway.app/api/;
        proxy_set_header Host fsd-lesson-dashboard-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # ── Performance: Cache static assets ──────────────
    # Vite adds content hashes to filenames (e.g., index-DRRCdBVC.js).
    # If the content changes, the filename changes.
    # So we can safely cache these files for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
