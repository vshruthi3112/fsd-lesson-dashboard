# ============================================
# Nginx Configuration for Lesson Dashboard Frontend
# ============================================
#
# Nginx serves two roles here:
# 1. STATIC FILE SERVER: Serves the React build (HTML, CSS, JS)
# 2. REVERSE PROXY: Forwards /api requests to the Spring Boot backend
#
# This replaces Vite's dev server proxy in production.

server {
    listen ${PORT};
    server_name localhost;

    # ── Serve React static files ──────────────────────
    # All files built by Vite live in /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    # ── React Router support ──────────────────────────
    # React is a Single Page Application (SPA).
    # When a user navigates to /lessons/1, the browser requests that path.
    # But there's no /lessons/1 file on disk — React handles routing in JS.
    # This rule says: "If the file doesn't exist, serve index.html instead"
    # so React's router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Reverse Proxy ─────────────────────────────
    # Forward /api requests to the Spring Boot backend on Railway.
    # resolver is needed for Nginx to resolve external hostnames in Alpine containers.
    location /api/ {
        resolver 8.8.8.8 8.8.4.4 valid=30s;
        set $backend "https://fsd-lesson-dashboard-production.up.railway.app";
        proxy_pass $backend/api/;
        proxy_set_header Host fsd-lesson-dashboard-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin "";
        proxy_ssl_server_name on;
    }

    # ── Performance: Cache static assets ──────────────
    # Vite adds content hashes to filenames (e.g., index-DRRCdBVC.js).
    # If the content changes, the filename changes.
    # So we can safely cache these files for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
