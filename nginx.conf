# ============================================
# Nginx Configuration for Lesson Dashboard Frontend
# ============================================
#
# Nginx serves as a STATIC FILE SERVER for the React SPA.
# API requests go directly from the browser to the backend
# (configured via VITE_API_URL at build time).

server {
    listen ${PORT};
    server_name localhost;

    # ── Serve React static files ──────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── React Router support (SPA) ────────────────────
    # If the file doesn't exist, serve index.html so React handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Performance: Cache static assets ──────────────
    # Vite adds content hashes to filenames — safe to cache long-term.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
