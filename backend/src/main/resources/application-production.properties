# ============================================
# Production Profile — application-production.properties
# ============================================
#
# WHAT IS A SPRING PROFILE?
# Spring profiles let you have different configurations for different environments.
# When SPRING_PROFILES_ACTIVE=production, Spring Boot loads:
#   1. application.properties (base config, always loaded)
#   2. application-production.properties (this file, overrides base)
#
# This means: development uses H2 in-memory DB + debug logging,
# while production uses stricter settings.
#
# Activate this profile by setting the environment variable:
#   SPRING_PROFILES_ACTIVE=production
# (Already configured in docker-compose.yml and Azure App Service settings)

# ── Server Configuration ─────────────────────────────
server.port=${SERVER_PORT:8080}

# ── Database ──────────────────────────────────────────
# Still using H2 in-memory for this project.
# In a real production app, you'd switch to PostgreSQL or MySQL:
#   spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
#   spring.datasource.username=${DB_USERNAME}
#   spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:h2:mem:lessonsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Disable H2 Console in production ─────────────────
# The H2 web console is a security risk in production — it gives
# direct database access through the browser.
spring.h2.console.enabled=false

# ── Logging (reduced for production) ─────────────────
logging.level.root=WARN
logging.level.com.lessondashboard=INFO
logging.level.org.springframework.security=WARN

# ── Security ─────────────────────────────────────────
# JWT secret and expiration are read from environment variables
# (set in docker-compose.yml or Azure App Service settings)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
