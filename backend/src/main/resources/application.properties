# ============================================
# Lesson Dashboard API - Configuration
# ============================================

# Server
server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:lessonsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (access at http://localhost:8080/h2-console for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize data on startup
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ============================================
# JWT Configuration
# ============================================
# Secret key for signing JWT tokens.
# PRODUCTION: Override with environment variable JWT_SECRET
# This must be at least 32 characters (256 bits) for HS256 algorithm.
jwt.secret=${JWT_SECRET:mySecretKeyForJWTtokenSigning2024LessonDashboard!}
# Token validity: 24 hours in milliseconds (24 * 60 * 60 * 1000)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# Logging Configuration
# ============================================
# Root level — INFO for production
logging.level.root=INFO

# Application-level logging — DEBUG for development, INFO for production
logging.level.com.lessondashboard=DEBUG

# Spring Security — WARN to reduce noise
logging.level.org.springframework.security=WARN

# Log format: timestamp, level, logger, message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# File logging (production)
logging.file.name=${LOG_PATH:logs}/lesson-dashboard.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# Validation Configuration
# ============================================
# Max request body size (prevent oversized payloads)
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-request-size=2MB
