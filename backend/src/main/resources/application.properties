# ============================================
# Lesson Dashboard API - Configuration
# ============================================

# Server
server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:lessonsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (access at http://localhost:8080/h2-console for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize data on startup
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ============================================
# JWT Configuration
# ============================================
# Secret key for signing JWT tokens.
# IMPORTANT: In production, use an environment variable, NOT a hardcoded string!
# This must be at least 32 characters (256 bits) for HS256 algorithm.
jwt.secret=mySecretKeyForJWTtokenSigning2024LessonDashboard!
# Token validity: 24 hours in milliseconds (24 * 60 * 60 * 1000)
jwt.expiration=86400000
